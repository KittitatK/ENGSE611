<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grade-switch</title>
</head>
<body>

<pre id="output">กำลังรัน...</pre>
<button onclick="runResult()">Runcode</button>
<script>
    function runResult() {

        const output = [];

        let score = Math.floor(Math.random() * 100) + 1;
        output.push("คะแนนที่สุ่มได้: " + score);
        console.log("คะแนนที่สุ่มได้:", score);

        if (score >= 80){
            output.push("เกรด: A");
            console.log("เกรด: A"); 
        }else if ( score >= 70){
            output.push("เกรด: B");
            console.log("เกรด: B"); 
        }else if ( score >= 60){
            output.push("เกรด: C");
            console.log("เกรด: C"); 
        }else if ( score >= 50){
            output.push("เกรด: D");
            console.log("เกรด: D"); 
        }else{
            output.push("เกรด: F");
            console.log("เกรด: F");   
        }
        

        if ( score >= 50){
            output.push("ผลสอบ: ผ่าน");
            console.log("ผลสอบ: ผ่าน");
        }else{
            output.push("ผลสอบ: ไม่ผ่าน");
            console.log("ผลสอบ: ไม่ผ่าน");
        }

        switch(true){
            case score >= 80:
                output.push("คำอธิบาย: ยอดเยี่ยมมาก");
                console.log("คำอธิบาย: ยอดเยี่ยมมาก");
                break;

            case score >= 70:
                output.push("คำอธิบาย: ดีมากรักษา มาตรฐานไว้");
                console.log("คำอธิบาย: ดีมากรักษา มาตรฐานไว้");
                break;

            case score >= 60:
                output.push("คำอธิบาย: ผ่านเกณฑ์ระดับดี");
                console.log("คำอธิบาย: ผ่านเกณฑ์ระดับดี");
                break;

            case score >= 50:
                output.push("คำอธิบาย: พอใช้ แต่ควรพัฒนาเพิ่ม");
                console.log("คำอธิบาย: พอใช้ แต่ควรพัฒนาเพิ่ม");
                break;

            case score >= 0:
                output.push("คำอธิบาย: ต้องลงทะเบียนเรียนใหม่");
                console.log("คำอธิบาย: ต้องลงทะเบียนเรียนใหม่");
                break;

            default:
                output.push("คำอธิบาย: error");
                console.log("คำอธิบาย: error");
                break;
                

        }

        document.getElementById("output").textContent = output.join("\n");
    }
</script>    
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grade-check</title>
</head>
<body>

<div id="output">กำลังรัน...</div>
<button onclick="runResult()">Runcode</button>
<script>
    function runResult() {

        const output = [];

        let dice = Math.floor(Math.random() * 100) + 1;
        output.push("คะแนนที่สุ่มได้: " + dice);
        console.log("คะแนนที่สุ่มได้:", dice);

        if (dice >= 80){
            output.push("เกรด: A");
            console.log("เกรด: A"); 
        }else if ( dice >= 70){
            output.push("เกรด: B");
            console.log("เกรด: B"); 
        }else if ( dice >= 60){
            output.push("เกรด: C");
            console.log("เกรด: C"); 
        }else if ( dice >= 50){
            output.push("เกรด: D");
            console.log("เกรด: D"); 
        }else{
            output.push("เกรด: F");
            console.log("เกรด: F");   
        }
        

        if ( dice >= 50){
            output.push("ผลสอบ: ผ่าน");
            console.log("ผลสอบ: ผ่าน");
        }else{
            output.push("ผลสอบ: ไม่ผ่าน");
            console.log("ผลสอบ: ไม่ผ่าน");
        }

        document.getElementById("output").textContent = output;
    }
</script>    
    
</body>
</html>

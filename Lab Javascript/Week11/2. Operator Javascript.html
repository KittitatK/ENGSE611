<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operatorjs</title>
</head>
<body>
    <button onclick="runDemo()">Run code</button>
    <script>
        function runDemo() {
            console.clear();
            const output = [];

            let studentName = 'สมชาย';
            let age = 20;
            let isStudent = true;
            const universityName = 'มหาวิทยาลัยเทคโนโลยี';

            output.push("ชื่อ" + studentName);
            console.log("ชื่อ", studentName);
            output.push("อายุ" + age);
            console.log("อายุ", age);

            age = 21;
            output.push("อายุใหม่" + age);
            console.log("อายุใหม่", age);

            try {
                universityName = 'มหาวิทยาลัยใหม่';

            }catch (e) {
                output.push("Error" + e.message);
                console.error(e.message);
            }

            document.getElementById("outputBox").textContent = output.join("\n");

            let aString = 'hello';
            let aNumber = 99.5;
            let aBoolean = true;
            let anUndefined;
            let aNull = null;

            output.push('Type of aString'+ typeof aString);
            console.log('Type of aString', typeof aString);

            output.push('Type of aNumber'+ typeof aNumber);
            console.log('Type of aNumber', typeof aNumber);

            output.push('Type of aBoolean'+ typeof aBoolean);
            console.log('Type of aBoolean', typeof aBoolean);

            output.push('Type of anUndefined'+ typeof anUndefined);
            console.log('Type of anUndefined', typeof anUndefined);

            output.push('Type of aNull'+ typeof aNull);
            console.log('Type of aNull', typeof aNull);
        }
    </script>
</body>
</html>
